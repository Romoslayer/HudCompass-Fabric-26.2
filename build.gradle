import net.fabricmc.loom.task.RemapJarTask
import net.fabricmc.loom.task.prod.ServerProductionRunTask

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    // 1.21.1 still ships obfuscated, so this is Loom's remapping variant rather than the plain
    // fabric-loom the 26.x build uses.
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = mod_version
group = 'dev.gigaherz.hudcompass'
base.archivesName = "${mod_id}-${mc_version}-fabric"

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())

repositories {
    mavenCentral()

    // JourneyMap API, for the optional integration -- soft dependency, compile-only, never
    // shaded/included. Both repos are listed per JourneyMap's own current setup guidance: the
    // new one is where they want people to move to, the old one is kept as a fallback since it
    // has a history of going down.
    maven {
        name = "New JourneyMap Maven"
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = "JourneyMap (Public)"
        url = 'https://jm.gserv.me/repository/maven-public/'
    }

    // ModMenu + Cloth Config, for the optional in-game config screen integration -- both are
    // the mod authors' own maven repos (real group:artifact:version coordinates), same
    // preference as the JourneyMap repos above over an opaque hash-keyed Modrinth Maven coordinate.
    maven {
        name = "TerraformersMC"
        url = 'https://maven.terraformersmc.com/releases/'
    }
    maven {
        name = "Shedaniel"
        url = 'https://maven.shedaniel.me/'
    }
}

loom {
    runs {
        configureEach {
            ideConfigGenerated(true)
            runDir('run')
        }

        client {
            client()
            setConfigName('Fabric: Client')
        }

        // Second instance for manual LAN/multiplayer testing -- separate run dir so it doesn't
        // collide with the primary client's config/log files when both run at once.
        client2 {
            client()
            setConfigName('Fabric: Client 2')
            runDir('run2')
        }
    }

    accessWidenerPath.set(file("src/main/resources/${mod_id}.accesswidener"))
}

dependencies {
    minecraft "com.mojang:minecraft:${mc_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}+${mc_version}"

    // JourneyMap API: compile-only soft dependency. "mod"-prefixed (unlike the 26.x build) because
    // 1.21.1 is obfuscated and this artifact is published against intermediary names, so Loom has
    // to remap it onto Mojang names before it can be compiled against. Never shaded into the jar,
    // and JourneyMap itself is never required at runtime -- see the integration's own package
    // javadoc for how the soft-dependency loading works.
    modCompileOnly "info.journeymap:journeymap-api-fabric:${journeymap_api_version}"

    // ModMenu + Cloth Config: compile-only soft dependencies for the in-game config screen,
    // matching the JourneyMap integration's pattern above -- neither is required at runtime,
    // see integrations.modmenu's package javadoc for how the soft-dependency loading works.
    // Cloth's own transitive Fabric API is excluded so it can't drag in a different version.
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
}

jar {
    from(files('LICENSE.txt'))

    manifest {
        attributes([
                "Specification-Title"     : "hudcompass",
                "Specification-Vendor"    : "gigaherz",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : "gigaherz, Romoslayer",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(java_version.toInteger())
}

processResources {
    inputs.property "version", project.version
    inputs.property "mod_name", mod_name
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version, "mod_name": mod_name
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Report every compile error, not javac's default first 100 -- a version backport surfaces a lot
// at once, and the full list is what drives the work.
tasks.named('compileJava') {
    options.compilerArgs += ['-Xmaxerrs', '2000']
}

// Automated in-game checks: gradlew runGameTest (a headless GameTest server, see src/gametest).
// Same layout as the user's other 1.21.1 Fabric branches (bosslike-mc1.21.1). Client GameTests
// don't exist in Fabric API until 1.21.4, so these cover the server half; the HUD/editor visuals
// get a separate client check.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'hudcompass-test'
        enableGameTests = true
        enableClientGameTests = false
    }
}

// Every run starts from a brand-new world.
tasks.register('deleteGameTestWorld', Delete) {
    delete layout.buildDirectory.dir('run/gameTest/world')
}
tasks.named('runGameTest') {
    dependsOn 'deleteGameTestWorld'
}

// The same tests against the built (remapped) jar in a normal Fabric server install:
// gradlew runProductionGameTest. This is what proves the mixins and access widener survive
// remapping to intermediary names, which the dev run (Mojang names throughout) can't show.
dependencies {
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${fabric_version}+${mc_version}"
}

tasks.register('gametestDevJar', Jar) {
    from sourceSets.gametest.output
    archiveClassifier = 'gametest-dev'
}

// 1.21.1 is obfuscated, so the test classes need intermediary names like the mod jar.
tasks.register('gametestJar', RemapJarTask) {
    inputFile = tasks.named('gametestDevJar').flatMap { it.archiveFile }
    archiveClassifier = 'gametest'
}

tasks.register('deleteProductionGameTestRunDir', Delete) {
    delete layout.buildDirectory.dir('run/productionGameTest')
}

tasks.register('runProductionGameTest', ServerProductionRunTask) {
    group = 'verification'
    description = 'Runs the in-game tests against the built jar in a normal Fabric server install.'
    dependsOn 'deleteProductionGameTestRunDir'
    mustRunAfter 'runGameTest'
    mods.from(tasks.named('gametestJar'))
    jvmArgs.add('-Dfabric-api.gametest')
    runDir = layout.buildDirectory.dir('run/productionGameTest')
}

// Visual smoke test of the client half (HUD, boss-bar push-down, F1, waypoint editor):
// gradlew runClientSmoke. Client GameTests don't exist before Fabric API for 1.21.4, so the test
// mod drives a real client from its own tick loop -- see HudCompassClientSmokeTest. The window
// opens hidden, unfocused and on the secondary monitor, never grabs the mouse, and the run quits
// by itself; screenshots + a pass/fail report land in build/run/clientSmoke.
loom {
    runs {
        clientSmoke {
            client()
            setConfigName('HUD Compass: client smoke test')
            ideConfigGenerated(false)
            source sourceSets.gametest
            runDir('build/run/clientSmoke')
            vmArg '-Dhudcompass.clientSmokeTest=true'
            vmArg '-Dfabric.noGui=true'
            programArgs '--width', '1280', '--height', '720'
        }
    }
}

tasks.named('runClientSmoke') {
    doFirst {
        def dir = layout.buildDirectory.dir('run/clientSmoke').get().asFile
        delete new File(dir, 'saves'), new File(dir, 'screenshots'), new File(dir, 'hudcompass-smoke-report.txt')
        dir.mkdirs()
        // version: is required -- without it the options datafixer treats the file as pre-1.13
        // and chokes on named keys. pauseOnLostFocus:false keeps the unfocused window ticking.
        new File(dir, 'options.txt').text = [
                'version:3955',
                'onboardAccessibility:false',
                'tutorialStep:none',
                'pauseOnLostFocus:false',
                'skipMultiplayerWarning:true',
                'guiScale:2',
                'soundCategory_master:0.0',
        ].join('\n') + '\n'
    }
}
